name: Build Android companion APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Public HTTPS URL of the deployed Sevan Connect service
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and build web assets
        run: |
          npm ci
          npm run build
          npx cap sync android
        env:
          VITE_SERVER_URL: ${{ inputs.backend_url }}

      - name: Build debug APK
        working-directory: android
        run: bash gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sevan-connect-debug-apk
          path: android/app/build/outputs/apk/debug/Sevan-Connect-debug.apk
          if-no-files-found: error

      - name: Publish APK download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-$(date -u +'%Y%m%d-%H%M%S')"
          gh release create "$tag" android/app/build/outputs/apk/debug/Sevan-Connect-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sevan Connect Android APK $tag" \
            --notes "Consent-based Android companion APK. Install it, review the sharing notice, then approve sharing on the phone."
