services:
  - type: web
    name: sevan-connect
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix server ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: PAIRING_CODE
        generateValue: true
